[pytest]
# The tests live in tests/ while the modules under test sit at the repo root, so
# pytest's default sys.path entry (the test file's own directory) is the wrong
# one: `import config` has to resolve against the root. Several tests also read
# repo files by CWD-relative path ("prework/targets/...", "sandbox/agent_tools"),
# which is why pytest must still be invoked FROM the root.
pythonpath = .

markers =
    slow: launches real containers; excluded from quick runs

# prework/targets/*/src/ is the extracted ARVO tree staged into the build
# context (see prework/build_image.py:build_image and .gitignore) -- a build
# artifact, not source of record. Those projects ship their own test suites,
# which pytest would otherwise collect and fail on, so a plain `pytest` run
# breaks as soon as any target has been built.
#
# results/ is the same story from the other direction: every run extracts a full
# project source tree under results/<exp>/.../source_tree/src, so a plain `pytest`
# run starts failing (on collection, not assertions) the moment any experiment has
# been started.
norecursedirs = prework/targets/*/src results .git
testpaths = tests
