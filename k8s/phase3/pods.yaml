apiVersion: v1
kind: Pod
metadata:
  name: phase3-selinux-baseline
  labels:
    app: phase3-fuzzer
    phase3-project: selinux
    phase3-variant: baseline
spec:
  restartPolicy: Never
  containers:
    - name: fuzzer
      image: phase3-selinux-baseline:codex-4
      imagePullPolicy: IfNotPresent
      env:
        - name: DURATION_SECONDS
          value: "21600"
        - name: RSS_LIMIT_MB
          value: "8192"
        - name: MALLOC_LIMIT_MB
          value: "8192"
        - name: SEED
          value: "1337"
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 8Gi
      volumeMounts:
        - name: corpus
          mountPath: /corpus
        - name: crashes
          mountPath: /crashes
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: corpus
      emptyDir: {}
    - name: crashes
      emptyDir: {}
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
---
